[platformio]
    libdeps_dir = .pio/shared_libdeps
    ; core_dir = C:/pio

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32.git

lib_ldf_mode = chain+

extra_scripts = pre:scripts/pack_html.py

build_flags =
    -O3
    -Wno-pragmas
    -DLED_BUILTIN=2
    -DIR_PIN=13
    -DCORE_DEBUG_LEVEL=0
    -I include/defs
    -I include/hardware
    -I include/modes
    -I include/profiles
    -I include/services
    -I include/hardware/sensors
    -I include/strategies

lib_deps =
    z3t0/IRremote
    fastled/FastLED
    madhephaestus/ESP32Servo
    mathieucarbou/ESPAsyncWebServer
    DNSServer
    Preferences
    pololu/VL53L0X

; ---------------------------------------------------------------------------
; Bancada: le todos os sensores da Caipora e imprime no monitor serial.
; Sobe sem WiFi, sem Bluetooth, sem maquina de estados e sem motores — o I2C
; fica so para os quatro VL53L0X, que e onde o reenderecamento por XSHUT falha.
; O build_src_filter exclui tudo e traz de volta so os drivers de sensor mais o
; programa de teste, entao nem main.cpp nem o ConfigServer entram no binario.
[env:caipora_sensores]
build_flags =
    ${env.build_flags}
    -DROBOT_CAIPORA
build_src_filter = -<*> +<hardware/sensors/> +<tools/CaiporaSensorTest.cpp>
; ---------------------------------------------------------------------------

[env:caipora]
build_flags =
    ${env.build_flags}
    -DROBOT_CAIPORA
; Limpa o platform_packages herdado do [env]: o fork da Bluepad32 foi
; compilado com CONFIG_BT_BLUEDROID_ENABLED e CONFIG_BT_NIMBLE_ENABLED
; desligados (só BTstack de verdade linkado nos .a) — confirmado com nm no
; toolchain xtensa, os símbolos esp_ble_gatts_*/esp_ble_gap_* não existem
; ali. O BleConfigServer novo usa BLEDevice.h (Bluedroid) e só linka no
; framework Arduino-ESP32 padrão do espressif32@6.10.0, sem esse fork.
platform_packages =
build_src_filter = +<*> -<tools/> -<hardware/Receiver.cpp> -<modes/RCMode.cpp> -<services/ConfigServer.cpp> -<strategies/MarolaAuto.cpp> -<strategies/SmokerAuto.cpp> -<strategies/ArruelaAuto.cpp>

[env:smoker]
build_flags =
    ${env.build_flags}
    -DROBOT_SMOKER
platform_packages =
build_src_filter = +<*> -<tools/> -<hardware/Receiver.cpp> -<modes/RCMode.cpp> -<services/ConfigServer.cpp> -<strategies/MarolaAuto.cpp> -<strategies/ArruelaAuto.cpp> -<strategies/CaiporaAuto.cpp>

[env:arruela]
build_flags =
    ${env.build_flags}
    -DROBOT_ARRUELA
platform_packages =
build_src_filter = +<*> -<tools/> -<hardware/Receiver.cpp> -<modes/RCMode.cpp> -<services/ConfigServer.cpp> -<strategies/MarolaAuto.cpp> -<strategies/SmokerAuto.cpp> -<strategies/CaiporaAuto.cpp>

[env:marola]
build_flags =
    ${env.build_flags}
    -DROBOT_MAROLA
platform_packages =
build_src_filter = +<*> -<tools/> -<hardware/Receiver.cpp> -<modes/RCMode.cpp> -<services/ConfigServer.cpp> -<strategies/SmokerAuto.cpp> -<strategies/ArruelaAuto.cpp> -<strategies/CaiporaAuto.cpp>

; ---------------------------------------------------------------------------
; Firmwares RC: desacoplados do AUTO (tools/RCFirmware/main.cpp em vez de
; src/main.cpp) pra tirar o Bluepad32/BTstack do binário do AUTO de vez —
; nada de hardware/sensors, strategies/, services/BleConfigServer.cpp ou
; services/ConfigServer.cpp entra aqui, só o que o RCMode/Receiver usa.
; Troca de modo agora é reflash (RC <-> AUTO), não mais IR em runtime.
; ---------------------------------------------------------------------------
[env:caipora_rc]
build_flags =
    ${env.build_flags}
    -DROBOT_CAIPORA
build_src_filter = -<*> +<hardware/> -<hardware/sensors/> +<modes/RCMode.cpp> +<services/MotionPlayer.cpp> +<tools/RCFirmware/main.cpp>

[env:smoker_rc]
build_flags =
    ${env.build_flags}
    -DROBOT_SMOKER
build_src_filter = -<*> +<hardware/> -<hardware/sensors/> +<modes/RCMode.cpp> +<services/MotionPlayer.cpp> +<tools/RCFirmware/main.cpp>

[env:arruela_rc]
build_flags =
    ${env.build_flags}
    -DROBOT_ARRUELA
build_src_filter = -<*> +<hardware/> -<hardware/sensors/> +<modes/RCMode.cpp> +<services/MotionPlayer.cpp> +<tools/RCFirmware/main.cpp>

[env:marola_rc]
build_flags =
    ${env.build_flags}
    -DROBOT_MAROLA
build_src_filter = -<*> +<hardware/> -<hardware/sensors/> +<modes/RCMode.cpp> +<services/MotionPlayer.cpp> +<tools/RCFirmware/main.cpp>

