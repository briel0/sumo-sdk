[platformio]
    libdeps_dir = .pio/shared_libdeps
    ; core_dir = C:/pio

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32.git

lib_ldf_mode = chain+

extra_scripts = pre:scripts/pack_html.py

build_flags =
    -O3
    -Wno-pragmas
    -DLED_BUILTIN=2
    -DIR_PIN=13
    -DCORE_DEBUG_LEVEL=0
    -I include/defs
    -I include/hardware
    -I include/modes
    -I include/profiles
    -I include/services
    -I include/hardware/sensors
    -I include/strategies

lib_deps =
    z3t0/IRremote
    fastled/FastLED
    madhephaestus/ESP32Servo
    mathieucarbou/ESPAsyncWebServer
    DNSServer
    Preferences
    pololu/VL53L0X

; ---------------------------------------------------------------------------
; Bancada: le todos os sensores da Caipora e imprime no monitor serial.
; Sobe sem WiFi, sem Bluetooth, sem maquina de estados e sem motores — o I2C
; fica so para os quatro VL53L0X, que e onde o reenderecamento por XSHUT falha.
; O build_src_filter exclui tudo e traz de volta so os drivers de sensor mais o
; programa de teste, entao nem main.cpp nem o ConfigServer entram no binario.
[env:caipora_sensores]
build_flags =
    ${env.build_flags}
    -DROBOT_CAIPORA
build_src_filter = -<*> +<hardware/sensors/> +<tools/CaiporaSensorTest.cpp>
; ---------------------------------------------------------------------------

[env:caipora]
build_flags = 
    ${env.build_flags}
    -DROBOT_CAIPORA
build_src_filter = +<*> -<tools/> -<strategies/MarolaAuto.cpp> -<strategies/SmokerAuto.cpp> -<strategies/ArruelaAuto.cpp>

[env:smoker]
build_flags =
    ${env.build_flags}
    -DROBOT_SMOKER
build_src_filter = +<*> -<tools/> -<strategies/MarolaAuto.cpp> -<strategies/ArruelaAuto.cpp> -<strategies/CaiporaAuto.cpp>

[env:arruela]
build_flags = 
    ${env.build_flags}
    -DROBOT_ARRUELA
build_src_filter = +<*> -<tools/> -<strategies/MarolaAuto.cpp> -<strategies/SmokerAuto.cpp> -<strategies/CaiporaAuto.cpp>

[env:marola]
build_flags =
    ${env.build_flags}
    -DROBOT_MAROLA
build_src_filter = +<*> -<tools/> -<strategies/SmokerAuto.cpp> -<strategies/ArruelaAuto.cpp> -<strategies/CaiporaAuto.cpp>

