[platformio]
    libdeps_dir = .pio/shared_libdeps

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -O3
    -DLED_BUILTIN=2
    -DIR_PIN=13
    -DCORE_DEBUG_LEVEL=0
    -I include/defs
    -I include/hardware
    -I include/modes
    -I include/profiles
    -I include/services

platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip

lib_ldf_mode = deep+

lib_deps =
    Bluepad32_ESP32
    z3t0/IRremote
    madhephaestus/ESP32Servo
    mathieucarbou/ESPAsyncWebServer
    DNSServer

[env:caipora]
build_flags = 
    ${env.build_flags}
    -DROBOT_CAIPORA

[env:smoker]
build_flags = 
    ${env.build_flags}
    -DROBOT_SMOKER

[env:smokerauto]
build_flags = 
    ${env.build_flags}
    -DROBOT_SMOKERAUTO

[env:arruela]
build_flags = 
    ${env.build_flags}
    -DROBOT_ARRUELA

[env:marola]
build_flags =
    ${env.build_flags}
    -DROBOT_MAROLA