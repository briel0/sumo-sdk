[platformio]
    libdeps_dir = .pio/shared_libdeps
    core_dir = C:/pio

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partição: o flash a ~97% NÃO é código de aplicação (o otimizador já descarta
; o que não é usado — dashboard morto, TUs não-referenciados). São os blobs
; pré-compilados de WiFi + BT/Bluepad32 + HTTP, sempre linkados porque todo
; robô suporta RC e AUTO. A partição default reserva só 1.31MB pro app com dois
; slots OTA que não usamos; huge_app dá 3MB num slot só (sem OTA). Isso troca os
; ~97% de 1.31MB por ~40% de 3MB, devolvendo a folga de flash sem tocar em nada.
board_build.partitions = huge_app.csv

platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32.git

lib_ldf_mode = deep+

build_flags =
    -O3
    -Wno-pragmas
    -DLED_BUILTIN=2
    -DIR_PIN=13
    -DCORE_DEBUG_LEVEL=0
    -I include/defs
    -I include/hardware
    -I include/modes
    -I include/profiles
    -I include/services
    -I include/hardware/sensors
    -I include/strategies

lib_deps =
    z3t0/IRremote
    fastled/FastLED
    madhephaestus/ESP32Servo
    mathieucarbou/ESPAsyncWebServer
    DNSServer
    pololu/VL53L0X

[env:caipora]
build_flags = 
    ${env.build_flags}
    -DROBOT_CAIPORA

[env:smoker]
build_flags = 
    ${env.build_flags}
    -DROBOT_SMOKER

[env:smokerauto]
build_flags = 
    ${env.build_flags}
    -DROBOT_SMOKERAUTO

[env:arruela]
build_flags = 
    ${env.build_flags}
    -DROBOT_ARRUELA

[env:marola]
build_flags =
    ${env.build_flags}
    -DROBOT_MAROLA

[env:fuego]
build_flags =
    ${env.build_flags}
    -DROBOT_FUEGO

[env:fueguito]
build_flags =
    ${env.build_flags}
    -DROBOT_FUEGUITO

[env:fumacinha]
build_flags =
    ${env.build_flags}
    -DROBOT_FUMACINHA

; Fumacinha RC — placa ESP32-C3 (supermini), build somente-RC.
; Board RISC-V diferente do resto (que é esp32dev). O build_src_filter compila só
; a pilha de RC: sem AUTO/WiFi/sensores/IR/LED (nada disso existe nessa placa),
; o que também evita compilar o Drive-MCPWM e o registrador GPIO.in do JS40F, que
; não existem no C3. Serial vai pela USB nativa (CDC on boot) porque as GPIOs
; 20/21 da UART0 viraram sinal de servo.
[env:fumacinha_rc]
; lolin_c3_mini = C3 mini de USB nativo (o "supermini"). Ele já traz nas
; extra_flags -DARDUINO_USB_MODE=1 e -DARDUINO_USB_CDC_ON_BOOT=1, que põem o
; Serial na USB nativa — necessário porque as GPIOs 20/21 (UART0) viraram servo.
board = lolin_c3_mini
; -ULED_BUILTIN neutraliza o -DLED_BUILTIN=2 herdado do [env]: no C3 o variant
; declara LED_BUILTIN como variável (não macro), e o -D o transformava em
; "static const uint8_t 2 = ..." — quebrando o Arduino.h inteiro (e o Serial).
build_flags =
    ${env.build_flags}
    -ULED_BUILTIN
    -DROBOT_FUMACINHA_RC
; Só ESP32Servo aqui — o build RC não usa FastLED/IRremote/AsyncWebServer/DNS, e
; sobrescrever lib_deps evita compilá-las (algumas nem compilam limpo no C3).
lib_deps =
    madhephaestus/ESP32Servo
build_src_filter =
    -<*>
    +<main_rc_c3.cpp>
    +<hardware/Drive.cpp>
    +<hardware/ServoMechanism.cpp>
    +<hardware/WeaponSystem.cpp>
    +<hardware/Receiver.cpp>
    +<modes/RCMode.cpp>
    +<services/MotionPlayer.cpp>