[platformio]
    libdeps_dir = .pio/shared_libdeps
    ; core_dir = C:/pio

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32.git

lib_ldf_mode = chain+

extra_scripts = pre:scripts/pack_html.py

build_flags =
    -O3
    -Wno-pragmas
    -DLED_BUILTIN=2
    -DIR_PIN=13
    -DCORE_DEBUG_LEVEL=0
    -I include/defs
    -I include/hardware
    -I include/modes
    -I include/profiles
    -I include/services
    -I include/hardware/sensors
    -I include/strategies

lib_deps =
    z3t0/IRremote
    fastled/FastLED
    madhephaestus/ESP32Servo
    mathieucarbou/ESPAsyncWebServer
    DNSServer
    Preferences
    pololu/VL53L0X

[env:caipora]
build_flags = 
    ${env.build_flags}
    -DROBOT_CAIPORA
build_src_filter = +<*> -<strategies/SmokerAuto.cpp> -<strategies/ArruelaAuto.cpp>

[env:smoker]
build_flags = 
    ${env.build_flags}
    -DROBOT_SMOKER
build_src_filter = +<*> -<strategies/SmokerAuto.cpp> -<strategies/ArruelaAuto.cpp> -<strategies/CaiporaAuto.cpp>

