
[platformio]
    ; Apesar do nome, o PlatformIO ainda cria uma subpasta por env aqui dentro
    ; (shared_libdeps/<env>), entao cada env baixa a propria copia das libs.
    libdeps_dir = .pio/shared_libdeps
    ; core_dir = C:/pio

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; huge_app: 3 MB de app, sem slot OTA. O AUTO com Bluedroid (BleConfigServer)
; passa de 1,5 MB e não cabe nos 1,25 MB do default.csv. Ninguém aqui faz OTA,
; então o app1 era espaço morto. A NVS continua em 0x9000/0x5000, igual ao
; default — o que está salvo (MotorPolarity etc.) sobrevive à troca de tabela.
; Vale pra todos os envs, pra NVS ficar no mesmo lugar no reflash AUTO<->RC.
board_build.partitions = huge_app.csv

; Commit fixo: sem o #hash cada PC clonava o HEAD do dia do fork.
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32.git#e010351b2cafe3a872f18878cb2d3e08f167c650

; chain, não chain+: o chain+ avalia os #if de cada fonte de cada lib, e só o
; FastLED 3.10.x tem mais de 2000 fontes — o "Scanning dependencies" ficava
; minutos a 100% de CPU sem compilar nada. O preço: o chain segue include
; dentro de #if morto, então lib com include de outra plataforma pode puxar lib
; errada — foi por isso que ESPAsyncWebServer e DNSServer (sem uso desde o
; BleConfigServer) saíram do lib_deps: arrastavam o WebServer do framework sem
; o WiFi. Vale pra todos os envs; não sobrescrever por env.
lib_ldf_mode = chain

build_flags =
    -O3
    -Wno-pragmas
    -DLED_BUILTIN=2
    -DIR_PIN=13
    -DCORE_DEBUG_LEVEL=0
    -I include/defs
    -I include/hardware
    -I include/modes
    -I include/profiles
    -I include/services
    -I include/hardware/sensors
    -I include/strategies

; Versões fixas: sem o @ cada PC baixava a mais recente do dia da instalação e
; o build mudava de uma máquina pra outra.
lib_deps =
    z3t0/IRremote@4.7.1
    fastled/FastLED@3.10.6
    madhephaestus/ESP32Servo@3.2.1
    Preferences
    pololu/VL53L0X@1.3.1

; ---------------------------------------------------------------------------
; Bancada: le todos os sensores da Caipora e imprime no monitor serial.
; Sobe sem WiFi, sem Bluetooth, sem maquina de estados e sem motores — o I2C
; fica so para os quatro VL53L0X, que e onde o reenderecamento por XSHUT falha.
; O build_src_filter exclui tudo e traz de volta so os drivers de sensor mais o
; programa de teste, entao nem main.cpp entra no binario.
[env:caipora_sensores]
build_flags =
    ${env.build_flags}
    -DROBOT_CAIPORA
build_src_filter = -<*> +<hardware/sensors/> +<tools/CaiporaSensorTest.cpp>
; ---------------------------------------------------------------------------

[env:caipora]
build_flags =
    ${env.build_flags}
    -DROBOT_CAIPORA
; Limpa o platform_packages herdado do [env]: o fork da Bluepad32 foi
; compilado com CONFIG_BT_BLUEDROID_ENABLED e CONFIG_BT_NIMBLE_ENABLED
; desligados (só BTstack de verdade linkado nos .a) — confirmado com nm no
; toolchain xtensa, os símbolos esp_ble_gatts_*/esp_ble_gap_* não existem
; ali. O BleConfigServer novo usa BLEDevice.h (Bluedroid) e só linka no
; framework Arduino-ESP32 padrão do espressif32@6.10.0, sem esse fork.
platform_packages =
build_src_filter = +<*> -<tools/> -<hardware/Receiver.cpp> -<modes/RCMode.cpp> -<strategies/MarolaAuto.cpp> -<strategies/SmokerAuto.cpp> -<strategies/ArruelaAuto.cpp>

; ---------------------------------------------------------------------------
; Bancada: le todos os sensores do Smoker e imprime no monitor serial.
; Sobe sem WiFi, sem Bluetooth, sem maquina de estados e sem motores. Sem
; VL53L0X aqui — so JS40F (digital) e QRE1113 (linha, analogico) — entao nao
; ha bring-up de I2C, so leitura direta.
; O build_src_filter exclui tudo e traz de volta so os drivers de sensor mais o
; programa de teste, entao nem main.cpp entra no binario.
[env:smoker_sensores]
build_flags =
    ${env.build_flags}
    -DROBOT_SMOKER
build_src_filter = -<*> +<hardware/sensors/> +<tools/SmokerSensorTest.cpp>
; ---------------------------------------------------------------------------

[env:smoker]
build_flags =
    ${env.build_flags}
    -DROBOT_SMOKER
platform_packages =
build_src_filter = +<*> -<tools/> -<hardware/Receiver.cpp> -<modes/RCMode.cpp> -<strategies/MarolaAuto.cpp> -<strategies/ArruelaAuto.cpp> -<strategies/CaiporaAuto.cpp>

; ---------------------------------------------------------------------------
; Bancada: le todos os sensores da Arruela e imprime no monitor serial.
; Sobe sem WiFi, sem Bluetooth, sem maquina de estados e sem motores. JS40F
; (digital), o VL53L0X unico (I2C, 0x29) e os dois QRE1113 de linha nos
; pinos 26 e 32 — sem WiFi o 26 (ADC2) le normal.
; O build_src_filter exclui tudo e traz de volta so os drivers de sensor mais o
; programa de teste, entao nem main.cpp entra no binario.
[env:arruela_sensores]
build_flags =
    ${env.build_flags}
    -DROBOT_ARRUELA
; Os sensores so precisam do VL53L0X.
lib_deps =
    pololu/VL53L0X@1.3.1
build_src_filter = -<*> +<hardware/sensors/> +<tools/ArruelaSensorTest.cpp>
; ---------------------------------------------------------------------------

[env:arruela]
build_flags =
    ${env.build_flags}
    -DROBOT_ARRUELA
platform_packages =
build_src_filter = +<*> -<tools/> -<hardware/Receiver.cpp> -<modes/RCMode.cpp> -<strategies/MarolaAuto.cpp> -<strategies/SmokerAuto.cpp> -<strategies/CaiporaAuto.cpp>

[env:marola]
build_flags =
    ${env.build_flags}
    -DROBOT_MAROLA
platform_packages =
build_src_filter = +<*> -<tools/> -<hardware/Receiver.cpp> -<modes/RCMode.cpp> -<strategies/SmokerAuto.cpp> -<strategies/ArruelaAuto.cpp> -<strategies/CaiporaAuto.cpp>

; ---------------------------------------------------------------------------
; Firmwares RC: desacoplados do AUTO (tools/RCFirmware/main.cpp em vez de
; src/main.cpp) pra tirar o Bluepad32/BTstack do binário do AUTO de vez —
; nada de hardware/sensors, strategies/ ou services/BleConfigServer.cpp
; entra aqui, só o que o RCMode/Receiver usa.
; Troca de modo agora é reflash (RC <-> AUTO), não mais IR em runtime.
; ---------------------------------------------------------------------------
[env:caipora_rc]
build_flags =
    ${env.build_flags}
    -DROBOT_CAIPORA_RC
build_src_filter = -<*> +<hardware/> -<hardware/sensors/> +<modes/RCMode.cpp> +<services/MotionPlayer.cpp> +<tools/RCFirmware/main.cpp>

[env:smoker_rc]
build_flags =
    ${env.build_flags}
    -DROBOT_SMOKER
build_src_filter = -<*> +<hardware/> -<hardware/sensors/> +<modes/RCMode.cpp> +<services/MotionPlayer.cpp> +<tools/RCFirmware/main.cpp>

[env:arruela_rc]
build_flags =
    ${env.build_flags}
    -DROBOT_ARRUELA
build_src_filter = -<*> +<hardware/> -<hardware/sensors/> +<modes/RCMode.cpp> +<services/MotionPlayer.cpp> +<tools/RCFirmware/main.cpp>

[env:marola_rc]
build_flags =
    ${env.build_flags}
    -DROBOT_MAROLA
build_src_filter = -<*> +<hardware/> -<hardware/sensors/> +<modes/RCMode.cpp> +<services/MotionPlayer.cpp> +<tools/RCFirmware/main.cpp>

