[platformio]
    libdeps_dir = .pio/shared_libdeps
    ; core_dir = C:/pio

; ---------------------------------------------------------------------------
; Branch do mini trator: só o firmware RC (Bluepad32) sobrou — sem sensores,
; sem estratégias/AUTO, sem WiFi/BLE de configuração.
; chain em vez de chain+: o FastLED 3.10 tem ~2600 arquivos e o chain+ roda o
; pré-processador em todos, travando minutos no "Scanning dependencies".
; Sem avaliar #if o LDF puxa a lib WebServer (e quebra sem WiFiServer.h) —
; daí o lib_ignore; o trator não usa nada de web.
; ---------------------------------------------------------------------------
[env:trator]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32.git

lib_ldf_mode = chain
lib_ignore = WebServer

build_flags =
    -O3
    -Wno-pragmas
    -DLED_BUILTIN=2
    -DIR_PIN=13
    -DCORE_DEBUG_LEVEL=0
    -DROBOT_TRATOR
    -I include/defs
    -I include/hardware
    -I include/modes
    -I include/profiles

lib_deps =
    z3t0/IRremote
    fastled/FastLED
    madhephaestus/ESP32Servo
    Preferences
