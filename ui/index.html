<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUMO AUTO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PAINEL DE ESTRATÉGIA -->
    <div id="strategy-panel">
        <h1>SUMO AUTO</h1>

        <h2>MOVIMENTAÇÃO INICIAL</h2>
        <div class="grid">
            <button class="btn-base btn-macro" data-category="macro" data-val="0" data-label="FRENTÃO">FRENTÃO</button>
            <button class="btn-base btn-macro" data-category="macro" data-val="1" data-label="FRENTÃO [FAST]">FRENTÃO [FAST]</button>
            <button class="btn-base btn-macro" data-category="macro" data-val="2" data-label="FRENTINHO">FRENTINHO</button>
            <button class="btn-base btn-macro" data-category="macro" data-val="3" data-label="CURVÃO">CURVÃO</button>
            <button class="btn-base btn-macro" data-category="macro" data-val="4" data-label="CURVINHA">CURVINHA</button>
            <button class="btn-base btn-macro" data-category="macro" data-val="5" data-label="EM V">EM V</button>
            <button class="btn-base btn-macro" data-category="macro" data-val="6" data-label="COSTAS">COSTAS</button>
            <button class="btn-base btn-macro" data-category="macro" data-val="7" data-label="DEFENSIVO">DEFENSIVO</button>
        </div>

        <h2>DIREÇÃO</h2>
        <div class="grid">
            <button class="btn-base btn-direction" data-category="direction" data-val="E" data-label="ESQUERDA">ESQUERDA</button>
            <button class="btn-base btn-direction" data-category="direction" data-val="D" data-label="DIREITA">DIREITA</button>
        </div>

        <h2>BUSCA E TÁTICA</h2>
        <div class="grid">
            <button class="btn-base btn-search" data-category="search" data-val="1" data-label="BUSCA PADRÃO">BUSCA PADRÃO</button>
            <button class="btn-base btn-search" data-category="search" data-val="2" data-label="BUSCA LENTA">BUSCA LENTA</button>
        </div>

        <h2>SISTEMA DE ARMAS</h2>
        <div class="grid">
            <button class="btn-base btn-weapon" data-category="weapon" data-val="0" data-label="DESARMAR">DESARMAR</button>
            <button class="btn-base btn-weapon" data-category="weapon" data-val="1" data-label="NÃO DESARMAR">NÃO DESARMAR</button>
        </div>

        <button class="btn-base btn-submit" onclick="openTacticalConfirm()">[SUBMETER ESTRATÉGIA]</button>

        <button class="btn-joystick-open" onclick="openJoystick()">[ ABRIR JOYSTICK ]</button>

        <h2>TESTE DE MACRO</h2>
        <div id="macro-steps">
            <div class="step-row" data-index="0">
                <span>Passo 1</span>
                <input type="text" class="step-input" placeholder="ESQ %" id="l0" min="-100" max="100">
                <input type="text" class="step-input" placeholder="DIR %" id="r0" min="-100" max="100">
                <input type="text" class="step-input" placeholder="MS" id="d0" min="50" max="5000">
            </div>
        </div>
        <div class="grid" style="margin-bottom: 10px;">
            <button class="btn-base btn-macro" onclick="addStep()">ADICIONAR PASSO</button>
            <button class="btn-base btn-macro" onclick="removeStep()">REMOVER PASSO</button>
        </div>
        <button class="btn-base btn-submit" onclick="dispararMacro()">[DISPARAR MACRO]</button>
    </div>

    <!-- PAINEL DO JOYSTICK (TELA CHEIA) -->
    <div id="joystick-panel">
        <div id="top-toolbar">
            <button id="btn-edit" class="tool-btn" onclick="toggleEditMode()">[ EDIT LAYOUT ]</button>
            <div id="edit-controls">
                <button class="tool-btn" onclick="resizeSelected(0.1)">[ + SCALE ]</button>
                <button class="tool-btn" onclick="resizeSelected(-0.1)">[ - SCALE ]</button>
                <button class="tool-btn" style="border-color: var(--alert-red); color: var(--alert-red);" onclick="resetLayout()">[ RESET ]</button>
                <button class="tool-btn" style="border-color: var(--edit-yellow); color: var(--edit-yellow);" onclick="toggleEditMode()">[ SAVE CONFIG ]</button>
            </div>
        </div>

        <div id="zone-analog" class="control-zone">
            <div id="joystick-base">
                <div id="joystick-knob"></div>
            </div>
            <div id="joystick-coords">X: 0 | Y: 0</div>
        </div>

        <div id="zone-action" class="control-zone">
            <div class="ps4-pad">
                <button class="btn-ps4 btn-tri" data-key="TRI">▲</button>
                <button class="btn-ps4 btn-sq" data-key="SQR">■</button>
                <button class="btn-ps4 btn-cir" data-key="CIR">●</button>
                <button class="btn-ps4 btn-x" data-key="X">✖</button>
            </div>
        </div>
    </div>

    <!-- ELEMENTOS COMPARTILHADOS -->
    <div id="terminal-log">> SYS STANDBY // UPLINK READY</div>

    <div id="custom-modal" class="modal-overlay">
        <div id="modal-container" class="modal-box">
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-body" class="modal-body"></div>
            <div id="modal-actions" class="modal-actions"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
