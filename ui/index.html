<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUMO AUTO</title>
    <!-- JetBrains Mono no lugar de Courier New — mantém a pegada monoespaçada
         "terminal", mas mais legível/técnica em telas pequenas. Se não
         carregar (sem internet na bancada, por exemplo) cai pro fallback
         abaixo sem quebrar nada, só perde o refinamento visual. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sea-green: #2c9246;
            --dark-spruce: #124925;
            --lemon-chiffon: #eeecc5;
            --grey-olive: #847f79;
            --dim-grey: #6e6965;
            --void-bg: #05140a;
            --alert-red: #ff3333;

            /* Escala de espaçamento — grid de 4px. Todo padding/margin/gap
               abaixo referencia um destes em vez de valor solto, pra manter
               o ritmo vertical/horizontal consistente pela página inteira. */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;

            /* Escala tipográfica — nomeia os tamanhos que já existiam no
               arquivo (não inventa valor novo), só formaliza como escala
               referenciável em vez de número solto em cada regra. */
            --fs-xs: 0.7rem;
            --fs-sm: 0.75rem;
            --fs-base: 0.85rem;
            --fs-md: 0.9rem;
            --fs-lg: 1rem;
            --fs-xl: 1.1rem;
            --fs-xxl: 1.2rem;

            --border-thin: 2px;
            --border-thick: 3px;

            /* Suaviza o canto reto do visual "brutalista" original sem
               abandonar a estrutura quadrada — valor pequeno de propósito. */
            --radius: 3px;

            /* Trava a largura de leitura em telas largas (tablet/desktop) —
               em telas de celular (a maioria dos casos de uso real) isso
               nunca entra em ação, o corpo continua ocupando 100% da tela. */
            --content-max-width: 480px;
        }

        * { box-sizing: border-box; font-family: 'JetBrains Mono', 'Courier New', Courier, monospace; }

        body {
            background-color: var(--void-bg);
            color: var(--lemon-chiffon);
            max-width: var(--content-max-width);
            margin: 0 auto;
            padding: var(--space-4);
            padding-bottom: var(--space-7);
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            color: var(--sea-green);
            font-size: var(--fs-xxl);
            text-align: center;
            border-bottom: var(--border-thin) solid var(--dark-spruce);
            padding-bottom: var(--space-3);
            margin-top: var(--space-1);
        }

        h2 {
            font-size: var(--fs-md);
            color: var(--lemon-chiffon);
            margin-top: var(--space-6);
            margin-bottom: var(--space-3);
            border-left: 4px solid var(--sea-green);
            padding-left: var(--space-2);
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
        .grid.grid-tight { margin-bottom: var(--space-2); }

        button {
            background-color: transparent;
            font-size: var(--fs-base);
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            padding: var(--space-4) var(--space-1);
            border-radius: var(--radius);
        }

        button:active { filter: brightness(1.5); }

        /* Enquanto um comando BLE desse botão está em voo — ver withBusy().
           Sem isso um toque não dava nenhuma confirmação de "pegou" até a
           resposta voltar, o que é perceptível quando a fila bleQueue já
           tem algo pendente na frente. */
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Botão .btn-diag "solo" (não dentro de .grid) que antes levava
           style="width:100%; margin-top:10px" inline — width já é 100% por
           padrão em button, só faltava o espaçamento em cima consistente. */
        .btn-diag-standalone { margin-top: var(--space-3); }

        .btn-diag {
            border: var(--border-thin) solid var(--alert-red);
            color: var(--alert-red);
        }
        .btn-diag.active {
            background-color: var(--alert-red);
            color: var(--void-bg);
        }

        #test-readout {
            display: none;
            margin-top: var(--space-2);
            padding: var(--space-2);
            background-color: #000;
            border: var(--border-thin) solid var(--alert-red);
            border-radius: var(--radius);
            font-size: var(--fs-sm);
            color: var(--sea-green);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .btn-macro {
            border: var(--border-thin) solid var(--sea-green);
            color: var(--lemon-chiffon);
        }
        .btn-macro.selected {
            background-color: var(--sea-green);
            color: var(--void-bg);
        }

        .btn-direction {
            border: var(--border-thin) solid var(--dim-grey);
            color: var(--lemon-chiffon);
        }
        .btn-direction.selected {
            background-color: var(--dim-grey);
            color: var(--void-bg);
        }

        .btn-search {
            border: var(--border-thin) solid var(--grey-olive);
            color: var(--lemon-chiffon);
        }
        .btn-search.selected {
            background-color: var(--grey-olive);
            color: var(--void-bg);
        }

        .btn-weapon {
            border: var(--border-thin) solid var(--lemon-chiffon);
            color: var(--lemon-chiffon);
        }
        .btn-weapon.selected {
            background-color: var(--lemon-chiffon);
            color: var(--dark-spruce);
        }

        .btn-submit {
            margin-top: var(--space-6);
            background-color: var(--dark-spruce);
            border: var(--border-thick) solid var(--sea-green);
            color: var(--lemon-chiffon);
            font-size: var(--fs-xxl);
            padding: var(--space-5);
            letter-spacing: 2px;
        }

        .connect-wrap {
            display: flex;
            justify-content: center;
            margin: var(--space-1) 0 var(--space-4);
        }

        .btn-connect {
            width: auto;
            background-color: var(--dark-spruce);
            border: var(--border-thick) solid var(--sea-green);
            color: var(--lemon-chiffon);
            padding: var(--space-4) var(--space-6);
            letter-spacing: 1px;
        }
        .btn-connect:active { filter: brightness(1.5); }

        /* STATUS DA CONEXÃO BLE — sem isso a UI nunca avisava se a conexão caiu */
        .conn-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            font-size: var(--fs-sm);
            letter-spacing: 1px;
            color: var(--dim-grey);
            margin-bottom: var(--space-4);
        }

        .conn-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: var(--dim-grey);
            flex-shrink: 0;
        }

        .conn-dot.connected { background-color: var(--sea-green); }
        .conn-dot.mock { background-color: var(--lemon-chiffon); }
        .conn-dot.lost { background-color: var(--alert-red); }

        /* TERMINAL DE LOG FIXO NO RODAPÉ */
        #terminal-log {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: var(--space-3);
            background-color: #000;
            border-top: var(--border-thin) solid var(--dark-spruce);
            font-size: var(--fs-xs);
            color: var(--sea-green);
            overflow-x: auto;
            white-space: nowrap;
            z-index: 99;
        }

        /* MODAL BRUTALISTA DE CONFIRMAÇÃO / ERRO */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(5, 20, 10, 0.95);
            z-index: 100;
            padding: var(--space-5);
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background-color: #000;
            border: var(--border-thick) solid var(--sea-green);
            border-radius: var(--radius);
            width: 100%;
            max-width: 400px;
            padding: var(--space-5);
        }

        .modal-box.error-mode {
            border-color: var(--alert-red);
        }

        .modal-title {
            font-size: var(--fs-xl);
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: var(--space-5);
            border-bottom: var(--border-thin) solid var(--dim-grey);
            padding-bottom: var(--space-2);
        }

        .modal-body {
            font-size: var(--fs-xl);
            font-weight: bold;
            line-height: 1.5;
            letter-spacing: 1.5px;
            margin-bottom: var(--space-6);
            color: var(--lemon-chiffon);
        }

        /* ESTILO DOS "MINI-BOTÕES" NO MODAL */
        .modal-chip {
            display: block;
            width: 100%;
            padding: var(--space-3);
            margin-bottom: var(--space-2);
            text-align: center;
            font-size: var(--fs-lg);
            font-weight: bold;
            text-transform: uppercase;
            border-radius: var(--radius);
            pointer-events: none; /* Impede clique */
        }

        /* Texto final antes dos botões de ação */
        .modal-prompt {
            text-align: center;
            margin-top: var(--space-5);
            font-size: var(--fs-md);
            color: var(--grey-olive);
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
        }

        .modal-actions.single-btn {
            grid-template-columns: 1fr;
        }

        .btn-abort { border: var(--border-thin) solid var(--alert-red); color: var(--alert-red); letter-spacing: 1px; }
        .btn-abort:active { background-color: var(--alert-red); color: #fff; }

        .btn-confirm { border: var(--border-thin) solid var(--sea-green); color: var(--sea-green); letter-spacing: 1px; }
        .btn-confirm:active { background-color: var(--sea-green); color: #000; }

        /* ESTILIZAÇÃO DO CONSTRUTOR DE MACROS (dentro do <details> — ver
           TESTE DE MACRO no body) */
        .step-row {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-3);
            background-color: rgba(44, 146, 70, 0.05);
            padding: var(--space-3);
            border-left: 3px solid var(--sea-green);
            border-radius: var(--radius);
        }

        .step-row span {
            font-weight: bold;
            color: var(--lemon-chiffon);
            min-width: 65px;
            font-size: var(--fs-base);
        }

        .step-input {
            flex: 1;
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--dark-spruce);
            color: var(--sea-green);
            padding: var(--space-3) var(--space-1);
            font-size: var(--fs-md);
            font-weight: bold;
            text-align: center;
            border-radius: var(--radius);
            appearance: textfield; /* Remove setinhas em alguns navegadores */
        }

        .step-input:focus {
            outline: none;
            border-color: var(--sea-green);
            background-color: rgba(44, 146, 70, 0.15);
        }

        .step-input::placeholder {
            color: var(--dim-grey);
            font-size: var(--fs-xs);
        }

        /* Campo com texto que não é um inteiro válido — ver isValidInt().
           Sem isso um valor tipo "abc" virava 0 silenciosamente na hora de
           montar o payload, sem nenhum aviso pro operador. */
        .step-input.invalid {
            border-color: var(--alert-red);
            background-color: rgba(255, 51, 51, 0.08);
        }

        /* SEÇÃO RECOLHÍVEL — TESTE DE MACRO é ferramenta de bancada avançada
           (poucos usam), fica fechada por padrão pra não alongar a rolagem
           da tela principal (config tática + diagnóstico, usados sempre). */
        details.collapsible {
            margin-top: var(--space-6);
            border-top: 1px solid var(--dark-spruce);
            padding-top: var(--space-1);
        }

        details.collapsible summary {
            cursor: pointer;
            list-style: none;
            font-size: var(--fs-md);
            color: var(--lemon-chiffon);
            padding: var(--space-2) 0;
        }

        details.collapsible summary::-webkit-details-marker { display: none; }

        details.collapsible summary::before {
            content: '▸ ';
            color: var(--sea-green);
        }

        details.collapsible[open] summary::before {
            content: '▾ ';
        }

    </style>
</head>
<body>

    <h1>SUMO AUTO</h1>

    <div class="connect-wrap">
        <button id="btn-connect" class="btn-connect" onclick="loadProfile()">CONECTAR AO ROBÔ (BLUETOOTH)</button>
    </div>
    <div class="conn-status">
        <span id="conn-dot" class="conn-dot"></span>
        <span id="conn-label">DESCONECTADO</span>
    </div>

    <h2>DIAGNÓSTICO DE BANCADA</h2>
    <div class="grid">
        <button id="btn-test-sensor" class="btn-diag" onclick="toggleTest('sensor')">TESTE SENSORES</button>
        <button id="btn-test-motor" class="btn-diag" onclick="toggleTest('motor')">TESTE MOTORES</button>
    </div>
    <div id="test-readout"></div>
    <button id="btn-motor-polarity" class="btn-diag btn-diag-standalone" onclick="openMotorPolarityConfirm()">POLARIDADE MOTORES</button>
    <button id="btn-weapon-toggle" class="btn-diag btn-diag-standalone" onclick="toggleWeapon()">ARMAR</button>

    <h2>MOVIMENTAÇÃO INICIAL</h2>
    <div class="grid" id="macro-grid">
        <!-- Renderizado dinamicamente -->
    </div>

    <h2>DIREÇÃO</h2>
    <div class="grid">
        <button class="btn-direction" data-category="direction" data-val="E" data-label="ESQUERDA">ESQUERDA</button>
        <button class="btn-direction" data-category="direction" data-val="D" data-label="DIREITA">DIREITA</button>
    </div>

    <h2>BUSCA E TÁTICA</h2>
    <div class="grid" id="search-grid">
        <!-- Renderizado dinamicamente -->
    </div>

    <h2>SISTEMA DE ARMAS</h2>
    <div class="grid" id="weapon-grid">
        <!-- Renderizado dinamicamente -->
    </div>

    <button id="btn-submit-tatica" class="btn-submit" onclick="openTacticalConfirm()">[SUBMETER]</button>

    <details class="collapsible">
        <summary>TESTE DE MACRO</summary>
        <div id="macro-steps">
            <div class="step-row" data-index="0">
                <span>Passo 1</span>
                <input type="text" class="step-input" placeholder="ESQ %" id="l0" min="-100" max="100">
                <input type="text" class="step-input" placeholder="DIR %" id="r0" min="-100" max="100">
                <input type="text" class="step-input" placeholder="MS" id="d0" min="50" max="5000">
            </div>
        </div>
        <div class="grid grid-tight">
            <button class="btn-macro" onclick="addStep()">ADICIONAR PASSO</button>
            <button class="btn-macro" onclick="removeStep()">REMOVER PASSO</button>
        </div>
        <button id="btn-disparar-macro" class="btn-submit" onclick="dispararMacro()">[DISPARAR MACRO]</button>
    </details>

    <div id="terminal-log">> SYS STANDBY // UPLINK READY</div>

    <div id="custom-modal" class="modal-overlay">
        <div id="modal-container" class="modal-box">
            <div id="modal-title" class="modal-title">CONFIRMAÇÃO TÁTICA</div>
            <div id="modal-body" class="modal-body"></div>
            <div id="modal-actions" class="modal-actions"></div>
        </div>
    </div>

    <script>
        // =================================================
        // CAMADA DE TRANSPORTE
        // =================================================
        // Único ponto de contato com o robô. Implementação BLE (Web
        // Bluetooth) — o firmware desta branch não serve mais HTTP, trocou
        // pra BleConfigServer (ver src/services/BleConfigServer.cpp, é a
        // fonte de verdade do protocolo abaixo). UI/estado/renderização de
        // perfil por robô embaixo continuam intactos, só isso mudou.
        //
        // Só existe em Chrome/Android — Safari/iOS não implementa Web
        // Bluetooth.
        //
        // Protocolo: uma característica só (0000FF11 no serviço 0000FF10).
        // WRITE = 1 byte de comando + payload; o READ seguinte devolve a
        // resposta (JSON cru pra GET_PROFILE/GET_SENSORS, 1 byte de
        // ack OK/ERRO pros comandos de escrita).
        const BLE_SERVICE_UUID = '0000ff10-0000-1000-8000-00805f9b34fb';
        const BLE_CHARACTERISTIC_UUID = '0000ff11-0000-1000-8000-00805f9b34fb';

        const BLE_CMD = {
            GET_PROFILE: 0x01,
            GET_SENSORS: 0x02,
            SET_STRATEGY: 0x03,
            SET_TEST: 0x04,
            TRIGGER_MACRO: 0x05,
            SET_WEAPON: 0x06,
            CYCLE_MOTOR_POLARITY: 0x07,
        };

        let bleCharacteristic = null;

        async function bleGetCharacteristic() {
            if (bleCharacteristic) return bleCharacteristic;
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: [BLE_SERVICE_UUID] }],
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(BLE_SERVICE_UUID);
            bleCharacteristic = await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);
            // Único jeito de saber que a conexão caiu sozinha (fora do alcance,
            // robô desligou, etc) — sem isso a UI ficava mostrando "conectado"
            // pra sempre até o próximo comando falhar. setConnectionStatus() é
            // definida mais abaixo, na camada de UI — está aqui na camada de
            // transporte só porque este arquivo inteiro é um script só.
            device.addEventListener('gattserverdisconnected', () => {
                bleCharacteristic = null;
                if (typeof setConnectionStatus === 'function') setConnectionStatus('lost');
                printLog('> [AVISO] CONEXÃO BLUETOOTH PERDIDA', true);
            });
            return bleCharacteristic;
        }

        // Escreve o comando e lê a resposta em seguida — mesmo ciclo
        // request/response que o BleConfigServer espera (um comando arma a
        // resposta, o READ que vem depois é que a entrega).
        //
        // Fila global: existe uma característica só, então dois bleCommand()
        // em paralelo (ex: o polling de /sensors a cada 150ms disparando de
        // novo antes do round-trip anterior voltar, ou um clique em outro
        // botão enquanto o polling roda) podiam embaralhar WRITE/READ de
        // comandos diferentes no ar — o READ de um pegava a resposta armada
        // pelo outro. Era isso que fazia a telinha de sensores "piscar" com
        // dado errado. bleQueue encadeia toda chamada, sempre esperando a
        // anterior (sucesso ou erro) antes de começar a próxima.
        let bleQueue = Promise.resolve();

        function bleCommand(bytes) {
            const run = async () => {
                const characteristic = await bleGetCharacteristic();
                await characteristic.writeValueWithResponse(bytes);
                const value = await characteristic.readValue();
                return new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
            };
            const result = bleQueue.then(run, run);
            // bleQueue só serve pra ordenar a fila — nunca pode ficar "travada"
            // rejeitada, senão todo comando futuro dispararia direto sem
            // esperar a vez. O erro de verdade ainda propaga em `result`,
            // pro chamador de bleCommand() tratar normalmente.
            bleQueue = result.catch(() => {});
            return result;
        }

        // Simula o formato de Response do fetch que os .then() abaixo (não
        // tocados nessa troca) já esperam: .ok/.status/.json()/.text().
        function bleJsonResponse(bytes) {
            const text = new TextDecoder().decode(bytes);
            let parsed = {};
            try { parsed = JSON.parse(text); } catch(e) { /* deixa {} se vier lixo/vazio */ }
            return { ok: true, status: 200, json: () => Promise.resolve(parsed), text: () => Promise.resolve(text) };
        }

        function bleAckResponse(bytes) {
            const ok = bytes.length > 0 && bytes[0] === 0x00;
            return {
                ok,
                status: ok ? 200 : 500,
                json: () => Promise.resolve({}),
                text: () => Promise.resolve(ok ? 'OK' : 'ERRO'),
            };
        }

        // CYCLE_MOTOR_POLARITY não devolve ACK_OK/ACK_ERROR — devolve o
        // índice novo (0-7) direto no primeiro (e único) byte da resposta.
        function blePolarityResponse(bytes) {
            const ok = bytes.length > 0;
            return { ok, index: ok ? bytes[0] : null };
        }

        // Desabilita o botão que disparou o comando enquanto a promise BLE
        // está em voo — reativa sozinho quando ela assenta (sucesso ou
        // erro). Só toca em `disabled`, nunca em innerText: várias chamadas
        // (ex: executeMotorPolarityCycle) mudam o texto do botão no .then()
        // de sucesso, e um "restaura texto original" aqui apagaria isso.
        function withBusy(btn, promise) {
            if(!btn) return promise;
            btn.disabled = true;
            return promise.finally(() => { btn.disabled = false; });
        }

        const Transport = {
            getProfile: () => bleCommand(new Uint8Array([BLE_CMD.GET_PROFILE])).then(bleJsonResponse),

            getSensorReadout: () => bleCommand(new Uint8Array([BLE_CMD.GET_SENSORS])).then(bleJsonResponse),

            // endpoint vem pronto como '/set-strat?macro=..&direction=..&search=..&weapon=..'
            // (ver executeTransmit) — parseia de volta pros 4 bytes que o
            // firmware espera. Defaults casam com os defaults de AutoStrategy
            // em RobotTypes.hpp (macro=0, direction='X', search=1, weapon=0),
            // pros campos que a UI deixa em branco quando o robô não oferece
            // aquela categoria.
            sendStrategy: (endpoint) => {
                const params = new URLSearchParams(endpoint.split('?')[1] || '');
                const bytes = new Uint8Array([
                    BLE_CMD.SET_STRATEGY,
                    parseInt(params.get('macro') || '0', 10) & 0xff,
                    (params.get('direction') || 'X').charCodeAt(0),
                    parseInt(params.get('search') || '1', 10) & 0xff,
                    parseInt(params.get('weapon') || '0', 10) & 0xff,
                ]);
                return bleCommand(bytes).then(bleAckResponse);
            },

            // query vem como 'sensor=1&t=169...' ou 'motor=0&t=169...' (ver
            // toggleTest) — o 't' é cache-buster de fetch, não significa nada
            // pro BLE, ignorado aqui.
            setTest: (query) => {
                const params = new URLSearchParams(query);
                const isMotor = params.has('motor');
                const state = parseInt(params.get(isMotor ? 'motor' : 'sensor') || '0', 10);
                const bytes = new Uint8Array([BLE_CMD.SET_TEST, isMotor ? 1 : 0, state ? 1 : 0]);
                return bleCommand(bytes).then(bleAckResponse);
            },

            // params vem como 'steps=2&l0=60&r0=60&d0=500&l1=..&r1=..&d1=..'
            // (ver dispararMacro). l/r cabem em int8 (velocidade -100..100);
            // atribuir negativo num Uint8Array já faz o wrap pro complemento
            // de 2 que o firmware espera em (int8_t)step[0]. d é u16 little-
            // endian, igual step[2] | (step[3]<<8) no BleConfigServer.cpp.
            //
            // MTU: 8 passos dá 34 bytes (1 cmd + 1 numSteps + 8*4), acima do
            // ATT MTU padrão (23 bytes) — depende do Android negociar MTU
            // maior. Sem hardware pra testar, fica em aberto; não é o
            // caminho crítico (é ferramenta de bancada, não o /set-strat).
            triggerMacroTest: (params) => {
                const p = new URLSearchParams(params);
                const numSteps = Math.min(8, Math.max(1, parseInt(p.get('steps') || '1', 10)));
                const bytes = new Uint8Array(2 + numSteps * 4);
                bytes[0] = BLE_CMD.TRIGGER_MACRO;
                bytes[1] = numSteps;
                for(let i = 0; i < numSteps; i++) {
                    bytes[2 + i * 4 + 0] = parseInt(p.get('l' + i) || '0', 10);
                    bytes[2 + i * 4 + 1] = parseInt(p.get('r' + i) || '0', 10);
                    const d = parseInt(p.get('d' + i) || '0', 10);
                    bytes[2 + i * 4 + 2] = d & 0xff;
                    bytes[2 + i * 4 + 3] = (d >> 8) & 0xff;
                }
                return bleCommand(bytes).then(bleAckResponse);
            },

            // arm=true arma (deploy), arm=false desarma (retract) — comando
            // manual de bancada, direto no WeaponSystem (ver AutoMode::run()).
            setWeapon: (arm) => {
                const bytes = new Uint8Array([BLE_CMD.SET_WEAPON, arm ? 1 : 0]);
                return bleCommand(bytes).then(bleAckResponse);
            },

            // Sem payload: cada chamada avança uma config (0..7, dá a volta).
            // Persiste na NVS do robô — sobrevive a reflash AUTO<->RC.
            cycleMotorPolarity: () => bleCommand(new Uint8Array([BLE_CMD.CYCLE_MOTOR_POLARITY])).then(blePolarityResponse),
        };

        // =================================================
        // LÓGICA DO TESTADOR DE MACRO
        // =================================================
        let numSteps = 1;

        function addStep() {
            if(numSteps >= 8) return;
            const div = document.createElement('div');
            div.className = 'step-row';
            div.dataset.index = numSteps;
            div.innerHTML = `
                <span>Passo ${numSteps + 1}</span>
                <input type="text" class="step-input" placeholder="ESQ %" id="l${numSteps}">
                <input type="text" class="step-input" placeholder="DIR %" id="r${numSteps}">
                <input type="text" class="step-input" placeholder="MS" id="d${numSteps}">
            `;
            document.getElementById('macro-steps').appendChild(div);
            numSteps++;
        }

        function removeStep() {
            if(numSteps <= 1) return;
            numSteps--;
            const rows = document.querySelectorAll('.step-row');
            rows[rows.length - 1].remove();
        }

        function parseInput(id, fallback) {
            const val = document.getElementById(id).value;
            return val !== '' ? parseInt(val) : fallback;
        }

        // Só inteiro (com sinal opcional) ou vazio — vazio é válido aqui
        // porque cada campo tem fallback (ver parseInput). Qualquer outra
        // coisa ("abc", "12.5", "--5") é inválida: sem essa checagem,
        // parseInt() delas vira NaN e o & 0xff na hora de montar o payload
        // transforma isso em 0 silenciosamente — comando errado sai pro
        // robô sem aviso nenhum.
        function isValidInt(val) {
            return val.trim() === '' || /^-?\d+$/.test(val.trim());
        }

        // Feedback em tempo real: pinta o campo de vermelho assim que o
        // valor digitado deixa de ser um inteiro válido, em vez de só
        // avisar no disparo.
        document.getElementById('macro-steps').addEventListener('input', function(e) {
            if(!e.target.classList.contains('step-input')) return;
            e.target.classList.toggle('invalid', !isValidInt(e.target.value));
        });

        function dispararMacro() {
            let firstInvalid = null;
            for(let i = 0; i < numSteps; i++) {
                ['l', 'r', 'd'].forEach(function(prefix) {
                    const input = document.getElementById(prefix + i);
                    const valid = isValidInt(input.value);
                    input.classList.toggle('invalid', !valid);
                    if(!valid && !firstInvalid) firstInvalid = input;
                });
            }
            if(firstInvalid) {
                showUiAlert('[!] ERRO', 'Campo com valor inválido (só número inteiro, ex: -60 ou 100).<br>Corrija o campo destacado em vermelho.', true);
                firstInvalid.focus();
                return;
            }

            const d0 = document.getElementById('d0').value;
            if(!d0) {
                showUiAlert('[!] ERRO', 'Preencha pelo menos a duração do Passo 1.', true);
                return;
            }

            let params = `steps=${numSteps}`;
            for(let i = 0; i < numSteps; i++) {
                const l = parseInput(`l${i}`, 0);
                const r = parseInput(`r${i}`, 0);
                const d = parseInput(`d${i}`, 300);
                params += `&l${i}=${l}&r${i}=${r}&d${i}=${d}`;
            }

            printLog('> DISPARANDO MACRO DE TESTE...');
            withBusy(document.getElementById('btn-disparar-macro'), Transport.triggerMacroTest(params))
                .then(res => res.text())
                .then(txt => {
                    printLog('> [OK] MACRO DISPARADA NO ROBÔ');
                    showUiAlert('MACRO DISPARADA', txt, false);
                })
                .catch(() => {
                    printLog('> [ERRO] ROBÔ NÃO RESPONDEU', true);
                    showUiAlert('NETWORK ERROR', 'Falha ao disparar macro.<br>Verifique a conexão Bluetooth.', true);
        });
}

        // =================================================
        // LÓGICA PRINCIPAL DA INTERFACE
        // =================================================
        const stratState = {
            macro: { val: '', label: 'NENHUM' },
            direction: { val: '', label: 'NENHUM' },
            search: { val: '', label: 'NENHUM' },
            weapon: { val: '', label: 'NENHUM' }
        };

        const logTerm = document.getElementById('terminal-log');
        const modal = document.getElementById('custom-modal');
        const mContainer = document.getElementById('modal-container');
        const mTitle = document.getElementById('modal-title');
        const mBody = document.getElementById('modal-body');
        const mActions = document.getElementById('modal-actions');

        const readoutBox = document.getElementById('test-readout');
        let readoutTimer = null;
        let testSensorActive = false;
        // true assim que a primeira leitura boa chega — antes disso ainda
        // vale mostrar "aguardando", depois disso um soluço pontual (JSON
        // vazio/corrompido, ou a promise rejeitando) só é ignorado: mantém
        // o último valor na tela em vez de piscar erro/espera a cada falha.
        let readoutRecebido = false;
        // A fila do bleCommand já serializa, mas se o round-trip demorar mais
        // que os 150ms do intervalo, cada tick empilharia mais um comando na
        // fila e o atraso só cresceria. Esse flag pula o tick se a leitura
        // anterior ainda não voltou, em vez de acumular.
        let readoutEmAndamento = false;

        function fetchReadout() {
            if (readoutEmAndamento) return;
            readoutEmAndamento = true;
            Transport.getSensorReadout()
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    const keys = Object.keys(data);
                    if (keys.length === 0) {
                        if (!readoutRecebido) {
                            readoutBox.innerText = '> aguardando leitura (robô sem sensores mapeados)...';
                        }
                        return;
                    }
                    readoutRecebido = true;
                    readoutBox.innerText = keys.map(function(key) {
                        return '> ' + key.toUpperCase() + ': ' + data[key];
                    }).join('\n');
                })
                .catch(function() {
                    if (!readoutRecebido) {
                        readoutBox.innerText = '> [ERRO] FALHA AO LER /sensors';
                    }
                })
                .finally(function() {
                    readoutEmAndamento = false;
                });
        }

        function startReadoutPolling() {
            readoutBox.style.display = 'block';
            readoutBox.innerText = '> iniciando...';
            readoutRecebido = false;
            fetchReadout();
            readoutTimer = setInterval(fetchReadout, 150); // Polling a ~6.6Hz
        }

        function stopReadoutPolling() {
            if (readoutTimer) {
                clearInterval(readoutTimer);
                readoutTimer = null;
            }
            readoutBox.style.display = 'none';
            readoutBox.innerText = '';
        }

        let weaponArmed = false;

        function updateWeaponButton() {
            const btn = document.getElementById('btn-weapon-toggle');
            btn.classList.toggle('active', weaponArmed);
            btn.innerText = weaponArmed ? 'DESARMAR' : 'ARMAR';
        }

        // Armar passa por confirmação (igual POLARIDADE MOTORES — ver
        // openMotorPolarityConfirm()); desarmar não, de propósito: tornar a
        // ação perigosa mais lenta e a ação segura mais rápida.
        function toggleWeapon() {
            if (navigator.vibrate) navigator.vibrate(20);

            const nextState = !weaponArmed;
            if (nextState) {
                openWeaponArmConfirm();
                return;
            }
            executeWeaponCommand(false);
        }

        function openWeaponArmConfirm() {
            mContainer.className = "modal-box";
            mTitle.innerText = "CONFIRMAR ARMAMENTO";
            mTitle.style.color = 'var(--alert-red)';
            mBody.innerHTML = `<div class="modal-prompt">Isso arma o sistema de armas do robô agora. Só usar em bancada, com o robô no ar e ninguém no raio de ação.</div>`;

            mActions.className = "modal-actions";
            mActions.innerHTML = `
                <button class="btn-abort" onclick="closeModal()">CANCELAR</button>
                <button class="btn-confirm" onclick="closeModal(); executeWeaponCommand(true);">ARMAR</button>
            `;
            modal.style.display = 'flex';
        }

        function executeWeaponCommand(nextState) {
            printLog('> ' + (nextState ? 'ARMANDO' : 'DESARMANDO') + ' ARMA...');
            withBusy(document.getElementById('btn-weapon-toggle'), Transport.setWeapon(nextState))
                .then(res => {
                    if (!res.ok) {
                        printLog('> [ERRO] COMANDO DE ARMA RECUSADO', true);
                        showUiAlert('[!] ERRO', 'O robô recusou o comando de arma.', true);
                        return;
                    }
                    weaponArmed = nextState;
                    updateWeaponButton();
                    printLog('> [OK] ARMA ' + (weaponArmed ? 'ARMADA' : 'DESARMADA'));
                })
                .catch(() => {
                    printLog('> [ERRO] ROBÔ NÃO RESPONDEU', true);
                    showUiAlert('NETWORK ERROR', 'Falha ao comandar a arma.<br>Verifique a conexão.', true);
                });
        }

        // Grava na NVS do robô e muda como ele interpreta "frente" — clique
        // sem querer no meio de outra coisa é caro (perde tempo de bancada
        // recalibrando). Passa sempre pelo modal de confirmação abaixo em
        // vez de agir no primeiro clique como TESTE MOTORES/ARMAR.
        function openMotorPolarityConfirm() {
            if (navigator.vibrate) navigator.vibrate(20);

            mContainer.className = "modal-box";
            mTitle.innerText = "CONFIRMAR POLARIDADE";
            mTitle.style.color = 'var(--lemon-chiffon)';
            mBody.innerHTML = `<div class="modal-prompt">Isso avança a config de polaridade dos motores e grava na memória do robô — vale pra qualquer firmware que suba depois (AUTO ou RC). Só usar em bancada, com o robô no ar.</div>`;

            mActions.className = "modal-actions";
            mActions.innerHTML = `
                <button class="btn-abort" onclick="closeModal()">CANCELAR</button>
                <button class="btn-confirm" onclick="executeMotorPolarityCycle()">AVANÇAR</button>
            `;
            modal.style.display = 'flex';
        }

        // Sem estado local pra "config certa" — quem decide é o operador,
        // ouvindo/vendo os motores girarem depois de cada clique. O número
        // só serve pra saber quantos cliques já deu (e voltar, se passar).
        function executeMotorPolarityCycle() {
            closeModal();
            if (navigator.vibrate) navigator.vibrate(20);

            printLog('> AVANÇANDO POLARIDADE DOS MOTORES...');
            withBusy(document.getElementById('btn-motor-polarity'), Transport.cycleMotorPolarity())
                .then(res => {
                    if (!res.ok) {
                        printLog('> [ERRO] COMANDO DE POLARIDADE RECUSADO', true);
                        showUiAlert('[!] ERRO', 'O robô recusou o comando de polaridade.', true);
                        return;
                    }
                    document.getElementById('btn-motor-polarity').innerText = 'POLARIDADE: #' + res.index;
                    printLog('> [OK] CONFIG #' + res.index + ' — TESTE OS MOTORES PRA CONFERIR');
                })
                .catch(() => {
                    printLog('> [ERRO] ROBÔ NÃO RESPONDEU', true);
                    showUiAlert('NETWORK ERROR', 'Falha ao comandar a polaridade.<br>Verifique a conexão.', true);
                });
        }

        let testMotorActive = false;

        function toggleTest(which) {
            if (navigator.vibrate) navigator.vibrate(20);

            if (which === 'sensor') {
                testSensorActive = !testSensorActive;
                if (testSensorActive && testMotorActive) { toggleTest('motor'); }
                
                document.getElementById('btn-test-sensor').classList.toggle('active', testSensorActive);
                
                printLog('> TESTE DE SENSORES: ' + (testSensorActive ? 'ATIVO' : 'DESLIGADO'));
                withBusy(document.getElementById('btn-test-sensor'), Transport.setTest('sensor=' + (testSensorActive ? '1' : '0') + '&t=' + Date.now()))
                    .then(() => {
                        if (testSensorActive) startReadoutPolling();
                        else stopReadoutPolling();
                    })
                    .catch(e => console.log(e));
            } 
            else if (which === 'motor') {
                testMotorActive = !testMotorActive;
                if (testMotorActive && testSensorActive) { toggleTest('sensor'); }

                document.getElementById('btn-test-motor').classList.toggle('active', testMotorActive);
                
                printLog('> TESTE DE MOTORES: ' + (testMotorActive ? 'ATIVO' : 'DESLIGADO'));
                withBusy(document.getElementById('btn-test-motor'), Transport.setTest('motor=' + (testMotorActive ? '1' : '0') + '&t=' + Date.now())).catch(e => console.log(e));
            }
        }

        function printLog(msg, isError = false) {
            logTerm.innerText = msg;
            logTerm.style.color = isError ? 'var(--alert-red)' : 'var(--sea-green)';
        }

        // 'idle' (nunca conectou), 'connected' (BLE de verdade), 'mock' (sem
        // Bluetooth no navegador, rodando com dados falsos só pra testar
        // layout) ou 'lost' (estava conectado e caiu). Existe justamente
        // porque antes a UI não distinguia nada disso — o botão dizia
        // "CONECTAR" pra sempre e um mock silencioso passava por conexão real.
        function setConnectionStatus(state) {
            const dot = document.getElementById('conn-dot');
            const label = document.getElementById('conn-label');
            const btn = document.getElementById('btn-connect');

            dot.className = 'conn-dot' + (state === 'idle' ? '' : ' ' + state);

            const labels = {
                idle: 'DESCONECTADO',
                connected: 'CONECTADO',
                mock: 'MODO MOCK — SEM ROBÔ DE VERDADE',
                lost: 'CONEXÃO PERDIDA',
            };
            label.innerText = labels[state] || labels.idle;

            btn.innerText = state === 'connected'
                ? 'RECONECTAR / TROCAR ROBÔ'
                : 'CONECTAR AO ROBÔ (BLUETOOTH)';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function showUiAlert(title, text, isError = false) {
            mContainer.className = isError ? "modal-box error-mode" : "modal-box";
            mTitle.innerText = title;
            mTitle.style.color = isError ? 'var(--alert-red)' : 'var(--sea-green)';
            mBody.innerHTML = `<div style="text-align:center;">${text}</div>`;
            mActions.className = "modal-actions single-btn";
            mActions.innerHTML = `<button class="btn-confirm" onclick="closeModal()">OK</button>`;
            modal.style.display = 'flex';
        }

        // Event Delegation para lidar com botões criados dinamicamente
        document.body.addEventListener('click', function(e) {
            const btn = e.target.closest('button[data-category]');
            if(!btn) return;

            if (navigator.vibrate) navigator.vibrate(20); 
            
            const category = btn.getAttribute('data-category');
            const val = btn.getAttribute('data-val');
            const label = btn.getAttribute('data-label');
            
            if (btn.classList.contains('selected')) {
                btn.classList.remove('selected');
                stratState[category] = { val: '', label: 'NENHUM' };
                printLog(`> CATEGORIA ${category.toUpperCase()} DESMARCADA`);
            }
            else {
                document.querySelectorAll(`button[data-category="${category}"]`).forEach(function(b) {
                    b.classList.remove('selected');
                });
                btn.classList.add('selected');
                stratState[category] = { val: val, label: label };
                printLog(`> SEL: ${category.toUpperCase()} -> ${label}`);
            }
        });

        // Construtor dinâmico do painel
        function loadProfile() {
            // Mock só entra quando o navegador NEM TEM Web Bluetooth (Safari/
            // iOS, ou testando o layout no PC sem hardware) — isso é conhecido
            // de antemão, sem precisar tentar conectar. Uma tentativa real que
            // falha (usuário cancelou o pareamento, Bluetooth desligado, GATT
            // não respondeu) cai no catch() abaixo e mostra erro de verdade —
            // antes isso também caía no mock e escondia a falha.
            if (!navigator.bluetooth) {
                console.log("Web Bluetooth indisponível neste navegador. Usando Mock do Arruela.");
                printLog('> BLUETOOTH INDISPONÍVEL NESTE NAVEGADOR — MODO MOCK (SÓ LAYOUT)', true);
                renderProfile({
                    robot_name: "Arruela (Local Mock)",
                    macros: [
                        {id: 0, name: "FRENTÃO"},
                        {id: 1, name: "CURVÃO"}
                    ],
                    searches: [
                        {id: 1, name: "BUSCA PADRÃO"}
                    ],
                    has_weapons: false
                });
                setConnectionStatus('mock');
                return;
            }

            printLog('> CONECTANDO AO ROBÔ...');
            withBusy(document.getElementById('btn-connect'), Transport.getProfile())
                .then(res => res.json())
                .then(data => {
                    renderProfile(data);
                    setConnectionStatus('connected');
                })
                .catch((err) => {
                    console.log(err);
                    printLog('> [ERRO] FALHA AO CONECTAR / LER PERFIL DO ROBÔ', true);
                    showUiAlert('[!] ERRO DE CONEXÃO', 'Não foi possível conectar ou ler o perfil do robô.<br>Verifique se o Bluetooth do robô está ligado e tente de novo.', true);
                });
        }

        function renderProfile(profile) {
            document.querySelector('h1').innerText = "SUMO AUTO // " + profile.robot_name.toUpperCase();
            
            const macroGrid = document.getElementById('macro-grid');
            macroGrid.innerHTML = profile.macros.map(m => 
                `<button class="btn-macro" data-category="macro" data-val="${m.id}" data-label="${m.name}">${m.name}</button>`
            ).join('');

            const searchGrid = document.getElementById('search-grid');
            searchGrid.innerHTML = profile.searches.map(s => 
                `<button class="btn-search" data-category="search" data-val="${s.id}" data-label="${s.name}">${s.name}</button>`
            ).join('');

            const weaponToggleBtn = document.getElementById('btn-weapon-toggle');
            weaponToggleBtn.disabled = !profile.has_weapons;
            weaponToggleBtn.style.opacity = profile.has_weapons ? '1' : '0.5';
            weaponArmed = false;
            updateWeaponButton();

            const weaponGrid = document.getElementById('weapon-grid');
            if(profile.has_weapons) {
                weaponGrid.innerHTML = `
                    <button class="btn-weapon" data-category="weapon" data-val="0" data-label="DESARMAR">DESARMAR</button>
                    <button class="btn-weapon" data-category="weapon" data-val="1" data-label="NÃO DESARMAR">NÃO DESARMAR</button>
                `;
            } else {
                weaponGrid.innerHTML = `<button class="btn-weapon selected" data-category="weapon" data-val="0" data-label="SEM ARMAS" disabled style="opacity: 0.5;">SEM ARMAS</button>`;
                stratState.weapon = { val: '0', label: 'SEM ARMAS' }; // Trava default
            }
            printLog(`> PERFIL ${profile.robot_name.toUpperCase()} CARREGADO`);
        }

        // NÃO chama loadProfile() sozinho no carregamento — Web Bluetooth
        // exige gesto do usuário (clique/toque) pra abrir o requestDevice(),
        // senão estoura SecurityError. Quem dispara é o botão "CONECTAR" no
        // topo da página.

        function openTacticalConfirm() {
            if (!stratState.macro.val) {
                showUiAlert("[!] ERRO CRÍTICO", "Selecione obrigatoriamente a Movimentação Inicial antes de realizar o Uplink.", true);
                printLog("> ERRO: PREENCHIMENTO INCOMPLETO", true);
                return;
            }

            // Construção do Relatório Visual com Caixinhas Coloridas
            let reportHtml = "";
            
            reportHtml += `<div class="modal-chip btn-macro selected">${stratState.macro.label}</div>`;
            
            if (stratState.direction.val) {
                reportHtml += `<div class="modal-chip btn-direction selected">${stratState.direction.label}</div>`;
            }
            
            if (stratState.search.val) {
                reportHtml += `<div class="modal-chip btn-search selected">${stratState.search.label}</div>`;
            }
            
            if (stratState.weapon.val) {
                reportHtml += `<div class="modal-chip btn-weapon selected">${stratState.weapon.label}</div>`;
            }

            reportHtml += `<div class="modal-prompt">Transmitir parâmetros para o robô?</div>`;

            mContainer.className = "modal-box";
            mTitle.innerText = "CONFIRMAÇÃO TÁTICA";
            mTitle.style.color = 'var(--lemon-chiffon)';
            mBody.innerHTML = reportHtml;
            
            mActions.className = "modal-actions";
            mActions.innerHTML = `
                <button class="btn-abort" onclick="closeModal()">ABORTAR</button>
                <button class="btn-confirm" onclick="executeTransmit()">TRANSMITIR</button>
            `;
            modal.style.display = 'flex';
        }

        function executeTransmit() {
            if (navigator.vibrate) navigator.vibrate([40, 50, 40]);

            // Força o desligamento do painel de diagnóstico para evitar poluição I2C durante a luta
            if (testSensorActive) {
                toggleTest('sensor');
            }
            if (testMotorActive) {
                toggleTest('motor');
            }

            closeModal();
            printLog("> EXECUTANDO UPLINK...");

            const params = new URLSearchParams();
            Object.keys(stratState).forEach(function(key) {
                if (stratState[key].val !== '') {
                    params.append(key, stratState[key].val);
                }
            });

            const endpoint = '/set-strat?' + params.toString();
            printLog("> TX: " + endpoint);

            withBusy(document.getElementById('btn-submit-tatica'), Transport.sendStrategy(endpoint))
                .then(function(response) {
                    if(response.ok) {
                        showUiAlert("UPLINK SUCCESS", "Configuração salva com sucesso!<br><br>Status: 200 OK", false);
                        printLog("> [OK 200] PARÂMETROS TRAVADOS NO ROBÔ");
                    } else {
                        showUiAlert("UPLINK FAILURE", "O robô recebeu os dados mas retornou erro:<br><br>STATUS " + response.status, true);
                        printLog("> [ERRO] STATUS HTTP: " + response.status, true);
                    }
                })
                .catch(function(err) {
                    showUiAlert("NETWORK ERROR", "Falha crítica de comunicação.<br><br>Verifique se o celular ainda está conectado por Bluetooth no robô.", true);
                    printLog("> [ERRO FATAL] SEM RESPOSTA DO ROBÔ", true);
                });
        }
    </script>
</body>
